name: Known defect diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Diagnostics (${{ matrix.os }}, Python 3.12.7)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      PYSTRAY_BACKEND: dummy
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.7'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Linux display prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Tk display
        run: |
          display_runner=()
          if [ "$RUNNER_OS" = Linux ]; then
            display_runner=(xvfb-run -a)
          fi
          "${display_runner[@]}" python -c "import tkinter as tk; root = tk.Tk(); root.withdraw(); root.update(); root.destroy()"
      - name: Run known defect diagnostics
        id: tests
        run: |
          display_runner=()
          if [ "$RUNNER_OS" = Linux ]; then
            display_runner=(xvfb-run -a)
          fi
          mkdir -p test-results
          set +e
          "${display_runner[@]}" python -m scripts.summarize_tests --run-diagnostics test-results/diagnostics.xml 2>&1 | tee test-results/diagnostics.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Summarize result
        if: always()
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        run: python scripts/summarize_tests.py diagnostics test-results/diagnostics.xml
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.os }}-python3.12.7
          path: test-results/
          if-no-files-found: error
