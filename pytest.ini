[pytest]
testpaths = tests
python_files = test_*.py
# Keep native Tk handles intact; CI's tee still records native stdout/stderr.
addopts = --strict-config --strict-markers --capture=sys -ra
timeout = 60
markers =
    gui: creates real Tk widgets; requires a display (Xvfb on Linux)
    integration: exercises multiple real application layers with isolated external boundaries
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    error::pytest.PytestUnraisableExceptionWarning
